name: Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build executable image (${{ matrix.label }})
    runs-on: ${{ matrix.os }}

    strategy:
      # Keep building the other platform even if one fails.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Produces a self-contained runtime image under target/jlinkImage with a
      # bin/silverBullet launcher (plus silverBullet.bat on Windows), native to
      # whichever runner OS this matrix leg runs on.
      - name: Build jlink runtime image
        run: mvn -B clean compile org.openjfx:javafx-maven-plugin:0.0.2:jlink

      # upload-artifact zips the directory on download, so no OS-specific
      # archiving step is needed.
      - name: Upload executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: silver-bullet-executable-${{ matrix.label }}
          path: target/jlinkImage
          if-no-files-found: error
