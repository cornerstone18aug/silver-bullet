name: Tests

on:
  push:
    branches:
      - master
      - 'feature/**'
  # Run on PRs into master. This covers Dependabot's dependency-update PRs
  # (which fire the pull_request event) and surfaces the result as a PR check.
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # JDK 21 (LTS): the pom targets --release 12, which needs a JDK >= 12,
      # so the repo's older JDK 11 CI configs cannot build this project.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # xvfb provides a virtual display so tests that start the JavaFX toolkit
      # (e.g. constructing players/board) can run on the headless runner.
      - name: Run tests
        run: xvfb-run -a mvn -B test

      # Publish the JaCoCo coverage report generated during the test phase.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

      # Send coverage to Codecov (drives the README badge). Needs the
      # CODECOV_TOKEN repository secret; the step is best-effort so a missing
      # token or upload hiccup never fails the build.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: target/site/jacoco/jacoco.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
